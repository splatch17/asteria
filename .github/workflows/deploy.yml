name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub evicts a cache unused for 7 days; without it the next deploy re-queries VizieR,
  # whose three mirrors can all be down at once (#212). Two runs a week keep it alive.
  schedule:
    - cron: "41 4 * * 1,4"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: packages/sky-data/requirements.txt
      - run: pip install -r packages/sky-data/requirements.txt pillow

      # Downloaded catalogues are cached; the pipeline re-validates its output every run.
      # A new key (any data script changed) still starts from the last downloads: re-querying
      # Gaia takes long and its archive can fail (#115). Raw files are named after their source.
      - uses: actions/cache/restore@v4
        with:
          path: packages/sky-data/raw
          key: sky-raw-${{ hashFiles('packages/sky-data/build_*.py') }}-${{ github.run_id }}
          restore-keys: |
            sky-raw-${{ hashFiles('packages/sky-data/build_*.py') }}-
            sky-raw-
      - id: raw-before
        run: echo "files=$(find packages/sky-data/raw -type f -printf '%P %s\n' 2>/dev/null | sort | sha1sum)" >> "$GITHUB_OUTPUT"
      - id: stars
        run: python packages/sky-data/build_stars.py
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
      # VizieR down (#212): ship the star catalogue already online rather than block the app. The
      # catalogue only changes with build_stars.py or its sources, so the previous build is the same
      # data; the scheduled runs keep querying VizieR and refresh it once it answers.
      - if: steps.stars.outcome == 'failure'
        env:
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          echo "::warning::build_stars.py failed (VizieR?): reusing the star catalogue from $SITE"
          mkdir -p packages/sky-data/out
          for f in stars.bin star-strings.json constellation-lines.json; do
            curl -fsS --retry 3 -o "packages/sky-data/out/$f" "$SITE/data/$f"
          done
      # Deep-sky objects (OpenNGC pinned release, #100); -I: the downloaded tables are untrusted data.
      - run: python -I packages/sky-data/build_deepsky.py
        env:
          PYTHONIOENCODING: utf-8
      - run: python packages/sky-data/build_earth.py
        env:
          PYTHONIOENCODING: utf-8
      # Realistic-style textures: optional, the app falls back to procedural colours without them.
      - run: python packages/sky-data/build_space.py
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
      # Constellation figures (#95), checked against the star catalogue built above: optional,
      # the figures layer is simply unavailable without them.
      - run: python packages/sky-data/build_figures.py
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
      # Milky Way texture (AT-HYG pinned commit, #162); -I: the downloaded catalogue is untrusted
      # data. Optional: without it the Milky Way layer draws nothing.
      - run: python -I packages/sky-data/build_milkyway.py
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
      # Saved even when a download failed, so the sources that did answer are not asked again on
      # the next attempt (#212), and only when raw/ changed. A run-specific key: GitHub never
      # overwrites an existing cache entry.
      - id: raw-after
        if: always() && steps.raw-before.outcome == 'success'
        run: echo "files=$(find packages/sky-data/raw -type f -printf '%P %s\n' 2>/dev/null | sort | sha1sum)" >> "$GITHUB_OUTPUT"
      - if: always() && steps.raw-after.outcome == 'success' && steps.raw-after.outputs.files != steps.raw-before.outputs.files
        uses: actions/cache/save@v4
        with:
          path: packages/sky-data/raw
          key: sky-raw-${{ hashFiles('packages/sky-data/build_*.py') }}-${{ github.run_id }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm data:sync
      - run: pnpm --filter @asteria/web build
        env:
          BASE_PATH: /asteria/
      - run: pnpm --filter @asteria/proto-orion build
      - run: cp -r prototypes/orion/dist apps/web/dist/proto-orion

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
